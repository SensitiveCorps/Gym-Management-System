<style>
/* Layout concept: gym door signage. A dark hours board on a cool concrete page, Eswatini blue for actions, flag yellow for presence ticks. */
:root{
  --bg:#EDEFF3; --surface:#FFFFFF; --surface2:#F5F6F9; --ink:#12161F; --muted:#586177; --line:#D6DAE3;
  --accent:#1E3FA6; --accent-ink:#FFFFFF; --accent-soft:#E2E8FA; --signal:#F5B312; --signal-ink:#201700;
  --good:#17724A; --good-soft:#DDF1E6; --warn:#8A5A00; --warn-soft:#FBEFD0; --bad:#B01F2E; --bad-soft:#F9DEE1;
  --board:#0B0F18; --board-ink:#F4F6FB; --board-mute:#8F99B2; --shadow:0 1px 2px rgba(18,22,31,.06),0 6px 20px rgba(18,22,31,.06);
  --veil:rgba(236,240,248,.18); --glass:rgba(247,248,251,.93);
  --f-display:'Barlow Condensed','Arial Narrow',Impact,sans-serif; --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}

  --accent:#7B96FF; --accent-ink:#0B1230; --accent-soft:#1E2748; --signal:#F5B312; --signal-ink:#201700;
  --good:#4CC48A; --good-soft:#12301F; --warn:#F0B84A; --warn-soft:#33260A; --bad:#FF7480; --bad-soft:#3A1219;
  --board:#05070C; --board-ink:#F4F6FB; --board-mute:#7F89A3; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3); --veil:rgba(6,9,16,.62); --glass:rgba(16,19,28,.92); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1017; --surface:#161A24; --surface2:#1D2230; --ink:#EEF0F6; --muted:#98A1B6; --line:#2A3042;
  --accent:#7B96FF; --accent-ink:#0B1230; --accent-soft:#1E2748; --signal:#F5B312; --signal-ink:#201700;

.bgfix::after{content:"";position:absolute;inset:0;background:var(--veil)}
#app,#modal-root{position:relative;z-index:1}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:clamp(2.4rem,6vw,4.1rem);font-weight:700}
h2{font-size:clamp(1.8rem,3.4vw,2.4rem)}
h3{font-size:1.45rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1160px;margin:0 auto}
.eyebrow{font:500 .78rem/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.88rem}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px;border-radius:4px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:44px;padding:.55em 1.1em;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.signal{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent}

function audit(entity,id,action,before,after){const clean=x=>x==null?null:JSON.parse(JSON.stringify(x,(k,v)=>['pw','password','password_hash','photo','idNum'].includes(k)?undefined:v));S.audit.push({id:uid('a'),entity,target:id,action,by:ui.session.id,at:nowStr(),before:clean(before),after:clean(after)})}

/* ---------- domain logic ---------- */
function hoursFor(date,scope=null){
  const resolve=svc=>{const ov=S.overrides.find(o=>!o.cancelled&&o.date===date&&(o.svc||null)===svc);
    if(ov)return ov.closed?{closed:true,reason:ov.reason||'Closed',override:true}:{open:ov.open,close:ov.close,override:true,reason:ov.reason};
    const h=svc?(S.areaHours[svc]||[])[dow(date)]:S.hours[dow(date)];
    if(h)return h.closed?{closed:true,reason:'Weekly closure'}:{open:h.open,close:h.close};
    if(svc){const service=S.services.find(s=>s.id===svc),slots=(service?.slots||[]).filter(x=>x.days.includes(dow(date))).sort((a,b)=>a.start.localeCompare(b.start));return slots.length?{open:slots[0].start,close:slots.map(x=>x.end).sort().at(-1)}:{closed:true,reason:'No scheduled hours'}}
    return {closed:true,reason:'Hours not configured'};
  };
  const gym=resolve(null);if(!scope||gym.closed)return gym;
  const area=resolve(scope);if(area.closed)return area;
  const open=area.open>gym.open?area.open:gym.open,close=area.close<gym.close?area.close:gym.close;
  return open<close?{...area,open,close}:{closed:true,reason:'Outside gym hours'};
}
function gymStatus(){
  const T=TODAY(),h=hoursFor(T),n=new Date(),m=gymMinutes();
  if(h.closed)return{open:false,label:h.sunday?'Closed today':'Closed today',sub:h.reason,h};
  if(m<mins(h.open))return{open:false,label:'Opens at '+h.open,sub:'Closes at '+h.close,h};
  if(m>=mins(h.close))return{open:false,label:'Closed for today',sub:'Opens again next open day',h};
  const left=mins(h.close)-m;return{open:true,label:'Open now',sub:`Closes at ${h.close} (${Math.floor(left/60)}h ${pad(left%60)}m left)`,h};
}

const memLeft=m=>{const e=memExpiry(m.id);return e===null?-9999:diffDays(e,TODAY())+(e>=TODAY()?1:0)};

function fmtDays(days){const d=[...days].sort((a,b)=>a-b),out=[];let i=0;
  while(i<d.length){let j=i;while(j+1<d.length&&d[j+1]===d[j]+1)j++;
    if(j-i>=2)out.push(DAYN[d[i]]+'–'+DAYN[d[j]]);else for(let k=i;k<=j;k++)out.push(DAYN[d[k]]);i=j+1}
  return out.join(', ')}
function nextSlot(s){const T=TODAY(),n=new Date(),nm=gymMinutes();

function niceMax(v){const raw=Math.max(v,1)/4,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p*4}
function bars(vals,labels,label){const W=600,H=230,L=38,B=28,Tp=16,max=niceMax(Math.max(...vals)),iw=W-L-8,ih=H-B-Tp,n=vals.length,bw=iw/n,bar=Math.min(bw*.62,44);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">`;
  for(let i=0;i<=4;i++){const y=Tp+ih-ih*i/4;s+=`<line class="gl" x1="${L}" x2="${W-8}" y1="${y}" y2="${y}"/><text class="ax" x="${L-6}" y="${y+4}" text-anchor="end">${Math.round(max*i/4)}</text>`}
  vals.forEach((v,i)=>{const x=L+bw*i+(bw-bar)/2,h=ih*v/max,y=Tp+ih-h;s+=`<rect class="bar ${i===n-1&&n<=12?'hi':''}" x="${x}" y="${y}" width="${bar}" height="${Math.max(h,0)}" rx="2"/>`;
    if(n<=12)s+=`<text class="val" x="${x+bar/2}" y="${y-5}" text-anchor="middle">${v}</text>`;s+=`<text class="ax" x="${x+bar/2}" y="${H-9}" text-anchor="middle">${labels[i]}</text>`});
  return s+'</svg>'}

  <form class="form card" data-form="hours" data-scope="${scope||''}" novalidate><h3>Weekly opening hours · ${esc(svcName(scope))}</h3>

  <form class="form card" data-form="override" novalidate><h3>Change one day only</h3><p class="muted small">Use this for a holiday, an event or a late start. It replaces the weekly hours for that date only.</p>
   <div class="fld"><label for="ov-scope">Affects</label><select id="ov-scope"><option value="">Whole gym</option>${S.services.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="cols"><div class="fld"><label for="ov-d">Date</label><input id="ov-d" type="date" min="${T}" value="${addDays(T,1)}"></div><div class="fld"><label for="ov-r">Reason (shown to the public)</label><input id="ov-r" placeholder="e.g. Public holiday"></div></div>

   <div class="stack">${S.overrides.filter(o=>!o.cancelled).slice().sort((a,b)=>a.date<b.date?-1:1).map(o=>`<div class="listrow"><div><b>${fmtD(o.date)} ${pd(o.date).getFullYear()} · ${esc(svcName(o.svc))}</b><div class="small muted">${esc(o.reason||'')}</div></div><div class="actions"><span class="pill ${o.closed?'bad':'warn'}">${o.closed?'Closed':o.open+' – '+o.close}</span><button class="btn sm danger" type="button" data-act="ovdel" data-id="${o.id}">Remove</button></div></div>`).join('')}</div></form>

  <div class="card"><h3>Change history</h3><div class="tblwrap"><table><thead><tr><th>Time</th><th>Actor</th><th>Change</th><th>Details</th></tr></thead><tbody>${[...S.audit].reverse().map(a=>`<tr><td class="mono">${esc(a.at)}</td><td>${esc(staffName(a.by))}</td><td>${esc(a.action+' '+a.entity)}</td><td><details><summary>View change</summary><pre style="max-width:360px;white-space:pre-wrap">${esc(JSON.stringify({before:a.before,after:a.after},null,2))}</pre></details></td></tr>`).join('')||'<tr><td colspan="4">No changes recorded yet.</td></tr>'}</tbody></table></div></div>

   <td><input id="pl-p${i}" type="number" min="0" step="0.01" value="${p.price}" aria-label="Price" style="min-height:40px;border:1.5px solid var(--line);border-radius:6px;padding:.2em .6em;background:var(--surface);width:100px"></td>
   <td><input id="pl-d${i}" type="number" min="1" value="${p.days}" step="1" aria-label="Days" style="min-height:40px;border:1.5px solid var(--line);border-radius:6px;padding:.2em .6em;background:var(--surface);width:90px"><div class="actions">${[[1,'Daily'],[7,'Weekly'],[30,'Monthly']].map(([n,label])=>`<button class="btn sm" type="button" data-act="planduration" data-i="${i}" data-days="${n}">${label}</button>`).join('')}</div></td><td><input id="pl-o${i}" type="checkbox" ${p.on?'checked':''} aria-label="On sale" style="width:20px;height:20px;accent-color:var(--accent)"></td></tr>`).join('')}</tbody></table></div>
   <div class="msg" role="alert"></div><div class="actions"><button class="btn primary" type="submit">Save plans</button><button class="btn" type="button" data-act="planadd">${ic('plus')} Add plan</button></div></form>`}
function pgStaff(){const T=TODAY();

  <form class="card form" data-form="newstaff" novalidate><h3>New staff account</h3><div class="cols"><div class="fld"><label for="ns-n">Full name</label><input id="ns-n"></div><div class="fld"><label for="ns-u">Username</label><input id="ns-u" autocapitalize="none"></div><div class="fld"><label for="ns-p">Password</label><input id="ns-p" type="password" autocomplete="new-password"></div></div>

    <td class="mono">${ed&&a.role==='staff'?`<input id="se-u" value="${esc(a.u)}" aria-label="Username" style="min-height:36px;border:1.5px solid var(--line);border-radius:6px;padding:.2em .6em;background:var(--surface);width:130px">`:esc(a.u)}</td><td>${a.role}</td><td class="mono">${lg?'In '+fmtT(lg.in):'Not in'}</td><td><span class="pill ${a.on?'good':'bad'}">${a.on?'Enabled':'Disabled'}</span></td>
    <td><div class="cell-actions">${pw?`<input id="sp-p" type="password" placeholder="New password" autocomplete="off" aria-label="New password"><button class="btn sm primary" data-act="pwsave" data-u="${a.u}">Set</button><button class="btn sm" data-act="pwcancel">Cancel</button>`
     :ed&&a.role==='staff'?`<button class="btn sm primary" data-act="stsave" data-u="${a.u}">Save</button><button class="btn sm" data-act="pwcancel">Cancel</button>`
     :`${a.role==='staff'?`<button class="btn sm" data-act="stedit" data-u="${a.u}">Edit</button>`:''}<button class="btn sm" data-act="pwedit" data-u="${a.u}">Reset password</button>${a.role==='staff'?`<button class="btn sm ${a.on?'danger':''}" data-act="sttoggle" data-u="${a.u}">${a.on?'Disable':'Enable'}</button>`:''}`}</div></td></tr>`}).join('')}</tbody></table></div></div>
  <div class="card"><h3>Presence log</h3><p class="small muted" style="margin:4px 0 10px">Recorded when a staff member logs in and out. Use it to confirm who was working.</p><div class="tblwrap"><table><thead><tr><th>Staff</th><th>Date</th><th>Signed in</th><th>Signed out</th><th class="num">Hours</th></tr></thead><tbody>${[...S.staffLog].sort((a,b)=>a.in<b.in?1:-1).slice(0,40).map(x=>{const h=x.out?((pd(x.out.slice(0,10))-pd(x.in.slice(0,10)))/36e5+(mins(x.out.slice(11,16))-mins(x.in.slice(11,16)))/60):null;

function pgDenied(){return `<div class="pg-head"><h1>Denied attempts</h1><p>Every refused check-in, with the reason and who was at the desk.</p></div>
  <div class="card"><div class="tblwrap"><table><thead><tr><th>Time</th><th>ID entered</th><th>Member</th><th>Reason</th><th>Staff</th></tr></thead><tbody>${[...S.denied].sort((a,b)=>a.time<b.time?1:-1).map(d=>{const m=S.members.find(x=>x.id===d.m);return `<tr><td class="mono">${fmtD(d.time.slice(0,10))} ${fmtT(d.time)}</td><td class="mono">${esc(d.idEntered)}</td><td>${m?esc(fullName(m)):'<span class="muted">Not found</span>'}</td><td><span class="pill bad">${esc(d.reason)}</span></td><td>${esc(staffName(d.staff))}</td></tr>`}).join('')||'<tr><td colspan="5" class="muted">No denied attempts.</td></tr>'}</tbody></table></div></div>`}

/* ---------- front desk: check-in ---------- */
function statusOf(m){const l=memLeft(m),e=memExpiry(m.id);
  if(!m.active)return{cls:'bad',t:'Suspended',sub:e?(l<0?'Membership expired '+fmtL(e):'Membership paid through '+fmtL(e)):'No paid membership'};
  if(l<0)return{cls:'bad',t:'Expired',sub:'Expired '+(e?fmtL(e):'')};
  if(l<10)return{cls:'warn',t:`Active · ${l} day${l===1?'':'s'} left`,sub:'Expires '+fmtL(e)+'. Tell the member to renew soon.'};
  return{cls:'good',t:`Active · ${l} days left`,sub:'Expires '+fmtL(e)}}
function memberCard(m,desk){const st=statusOf(m),ins=isInside(m.id);
  return `<article class="mc"><span class="av sq big" style="background:${AVC[(m.first.length+m.sur.length)%AVC.length]}">${m.photo?`<img src="${m.photo}" alt="Photo of ${esc(fullName(m))}">`:esc(m.first[0]+m.sur[0])}</span>
   <div class="info"><h3>${esc(fullName(m))}</h3><div class="mono small muted">${esc(m.idType)} · ${esc(m.idNum)}</div><div class="actions"><span class="pill ${st.cls}">${st.t}</span>${ins?`<span class="pill blue">Inside since ${fmtT(ins.in)}</span>`:''}</div><div class="small muted">${esc(memPlan(m))} · ${esc(st.sub)}</div></div>
   ${desk?`<div class="acts">${ins?`<button class="btn primary" data-act="checkout" data-id="${m.id}">${ic('out')} Check out</button>`:`<button class="btn primary" data-act="ciconfirm" data-id="${m.id}">${ic('check')} ${validPhoto(m.photo)?'Photo matches. Check in':'Photo required — entry will be refused'}</button><button class="btn" data-act="ciphoto" data-id="${m.id}">Photo does not match</button>`}<button class="btn" data-act="renew" data-id="${m.id}">Renew</button><button class="btn ghost" data-act="memopen" data-id="${m.id}">History</button></div>`:''}</article>`}
function ciResults(){const q=ui.q.trim().toLowerCase();let h='';
  if(ui.ciMsg)h+=`<div class="msg ${ui.ciMsg.type}" role="status">${esc(ui.ciMsg.text)}${ui.ciMsg.renew?` <button class="btn sm" data-act="renew" data-id="${ui.ciMsg.renew}" style="margin-left:8px">Renew now</button>`:''}</div>`;
  if(!q)return h+'<div class="card flat muted">Type a name or ID number. The photo on screen must match the person at the desk before you confirm.</div>';
  const r=S.members.filter(m=>fullName(m).toLowerCase().includes(q)||m.idNum.toLowerCase().includes(q));
  if(!r.length)return h+`<div class="card stack"><b>No member found for “${esc(ui.q)}”.</b><p class="muted">The person cannot be checked in. You can log this attempt.</p><div><button class="btn danger" data-act="cinomatch">Log denied attempt (unknown ID)</button></div></div>`;
  return h+`<div class="results">${r.map(m=>memberCard(m,true)).join('')}</div>`}
function pgCheckin(){const ins=S.checkins.filter(c=>!c.out);
  return `<div class="pg-head"><span class="eyebrow">Front desk</span><h1>Check-in</h1></div>${ui.session.role==='staff'&&unread(ui.session.id).length?`<div class="msg info">You have ${unread(ui.session.id).length} new message${unread(ui.session.id).length===1?'':'s'} from the manager. <button class="btn sm" data-act="nav" data-tab="msgs" style="margin-left:8px">Read</button></div>`:''}
  <div class="card form"><div class="fld"><label for="ci-q">Name or ID number</label><input id="ci-q" data-live="ci" value="${esc(ui.q)}" placeholder="e.g. Sipho or 202301234" autocomplete="off"></div></div>
  <div id="ci-res" class="stack">${ciResults()}</div>

const sumA=a=>a.reduce((t,p)=>t+p.amount,0);
function pgFinance(){const R=ui.finR,rg=finRange(R),T=TODAY(),pays=S.payments.filter(p=>inR(p,rg)).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(a.receipt<b.receipt?1:-1)),tot=sumA(pays),prevT=rg.prev?sumA(S.payments.filter(p=>inR(p,rg.prev))):null;
  const names={today:'Today',week:'This week',month:'This month',year:'This year',all:'All time'};
  const chg=prevT===null?null:prevT===0?(tot>0?100:0):Math.round((tot-prevT)/prevT*100);
  const byPlan={},byStaff={};pays.forEach(p=>{(byPlan[p.plan]=byPlan[p.plan]||{n:0,a:0}).n++;byPlan[p.plan].a+=p.amount;(byStaff[p.staff]=byStaff[p.staff]||{n:0,a:0}).n++;byStaff[p.staff].a+=p.amount});
  const stake=S.members.filter(m=>{const l=memLeft(m);return l>=0&&l<10}).reduce((t,m)=>{const lp=S.payments.filter(x=>x.memberId===m.id).sort((a,b)=>a.expiry<b.expiry?1:-1)[0],pl=lp&&S.plans.find(x=>x.id===lp.planId);return t+(pl?pl.price:lp?lp.amount:0)},0);
  const dv=[],dl=[];for(let k=13;k>=0;k--){const d=addDays(T,-k);dv.push(sumA(S.payments.filter(p=>p.date===d)));dl.push(String(pd(d).getDate()))}
  const mv=[],ml=[];for(let k=5;k>=0;k--){const d=new Date(now0.getFullYear(),now0.getMonth()-k,1),pf=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;mv.push(sumA(S.payments.filter(p=>p.date.startsWith(pf))));ml.push(MON[d.getMonth()])}
  const tr=o=>Object.entries(o).sort((a,b)=>b[1].a-a[1].a);
  return `<div class="pg-head"><span class="eyebrow">Records</span><h1>Finance</h1><p>Cash received at the front desk. The system records cash in only. It does not track expenses.</p></div>

  <p class="small muted mono">${fmtL(rg.from)} to ${fmtL(rg.to)}</p>

   <div class="tile"><span class="eyebrow">Average payment</span><span class="v">${pays.length?E(Math.round(tot/pays.length)):'E0'}</span></div>
   <div class="tile"><span class="eyebrow">${prevT===null?'Previous period':'Vs previous '+rg.len+' day'+(rg.len===1?'':'s')}</span><span class="v">${chg===null?'–':(chg>0?'+':'')+chg+'%'}</span>${prevT===null?'':`<span class="small muted mono">was ${E(prevT)}</span>`}</div>
   <div class="tile"><span class="eyebrow">Renewals due in 10 days</span><span class="v">${E(stake)}</span></div></div>
  <div class="charts"><div class="card chart"><h3>Cash per day (E)</h3><p class="small muted" style="margin-bottom:8px">Last 14 days. Labels are the day of the month.</p>${bars(dv,dl,'Cash received per day')}</div>
   <div class="card chart"><h3>Cash per month (E)</h3><p class="small muted" style="margin-bottom:8px">Last 6 months.</p>${bars(mv,ml,'Cash received per month')}</div></div>
  <div class="charts"><div class="card"><h3 style="margin-bottom:8px">By plan</h3><div class="tblwrap"><table><thead><tr><th>Plan</th><th class="num">Payments</th><th class="num">Cash</th><th class="num">Share</th></tr></thead><tbody>${tr(byPlan).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${v.n}</td><td class="num">${E(v.a)}</td><td class="num">${tot?Math.round(v.a/tot*100):0}%</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No payments in this period.</td></tr>'}</tbody><tfoot><tr class="tfoot"><td>Total</td><td class="num">${pays.length}</td><td class="num">${E(tot)}</td><td class="num">${tot?'100%':'0%'}</td></tr></tfoot></table></div></div>

function canManageMembers(managerOnly=false){const actor=me();return !!(ui.session&&actor&&actor.on&&actor.role===ui.session.role&&(managerOnly?actor.role==='manager':['staff','manager'].includes(actor.role)))}
function setMemberStatuses(ids,enabled){
  if(!canManageMembers()||typeof enabled!=='boolean'){toast('An enabled staff or manager account is required.');return false}
  const selected=new Set(ids),changed=S.members.filter(m=>selected.has(m.id)&&m.active!==enabled);
  if(!changed.length)return false;

  // Publish the new in-memory state only after the complete browser write succeeds.
  try{const text=JSON.stringify(next);if(!API_MODE)localStorage.setItem(KEY,text);committedState=text}catch(e){toast('Account status was not saved. Browser storage is unavailable or full. Try again.');return false}
  S=next;return true;
}

function installGuards(){
 const staffActions=['ciconfirm','ciphoto','cinomatch','checkout','renew','memopen','togglemem','regagain','memedit'];
 const managerActions=['svcnew','svcedit','svccancel','insadd','insdel','sladd','sldel','slotday','svcphotoclear','ovdel','noteedit','noticeeditcancel','notecancel','planadd','planduration','stedit','pwedit','pwcancel','pwsave','stsave','sttoggle','report','finrange','suspendask','suspendallask','suspendyes','suspendallyes','msgdel'];

 for(const name of [...staffActions,...managerActions]){const fn=A[name];if(fn)A[name]=(...args)=>safeAction(()=>{requireRole(staffActions.includes(name)?['staff','manager']:['manager']);if(API_MODE&&['memopen','memedit','renew'].includes(name)){if(name==='memedit')ui.editPhoto=null;return serverMemberView(args[0],name==='memopen'?'member':name==='memedit'?'editmember':'renew')}return API_MODE&&SERVER_ACTIONS[name]?serverAction(name,args[0]):fn(...args)})}

  planadd(){S.plans.push({id:uid('p'),name:'New plan '+S.nextId,price:0,days:30,on:false});save();render()},
  /* staff */
  stedit(t){ui.staffEdit=t.dataset.u;ui.staffPw=null;render()},
  pwedit(t){ui.staffPw=t.dataset.u;ui.staffEdit=null;render();const i=$('#sp-p');i&&i.focus()},
  pwcancel(){ui.staffEdit=null;ui.staffPw=null;render()},
  pwsave(t){const v=$('#sp-p').value;if(v.length<8){toast('Use at least 8 characters');return}S.staff.find(x=>x.u===t.dataset.u).pw=v;save();ui.staffPw=null;toast('Password changed');render()},
  stsave(t){const a=S.staff.find(x=>x.u===t.dataset.u),n=$('#se-n').value.trim(),u=$('#se-u').value.trim().toLowerCase();
    if(!n||!u){toast('Name and username are required');return}if(u!==a.u&&S.staff.some(x=>x.u===u)){toast('That username is taken');return}

    S.staffMsgs.forEach(x=>{if(x.to===a.u)x.to=u;if(x.by===a.u)x.by=u;x.read=x.read.map(r=>r===a.u?u:r)});
    a.name=n;a.u=u;save();ui.staffEdit=null;toast('Staff details saved');render()},
  sttoggle(t){const a=S.staff.find(x=>x.u===t.dataset.u);a.on=!a.on;save();toast(a.on?'Account enabled':'Account disabled. They can no longer log in.');render()}
};

document.addEventListener('click',e=>{
  if(!e.target.closest('.bellwrap')){const p=$('#bellpanel');if(p&&!p.hidden){p.hidden=true;const b=$('.bell');b&&b.setAttribute('aria-expanded','false')}}
  const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f){if(t.tagName==='A')e.preventDefault();f(t,e)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal)A.closemodal();if(e.key==='Tab'&&ui.modal){const nodes=[...document.querySelectorAll('#modal-root button:not([disabled]),#modal-root input:not([disabled]),#modal-root select,#modal-root textarea,#modal-root a[href]')].filter(n=>!n.hidden);const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
document.addEventListener('input',e=>{const t=e.target;
  if(API_MODE&&['ci','mem'].includes(t.dataset.live)){serverSearch(t);return}
  if(t.dataset.live==='ci'){ui.q=t.value;ui.ciMsg=null;ciRefresh()}
  else if(t.dataset.live==='mem'){ui.mq=t.value;$('#mem-tbl').innerHTML=memTable()}
  else if(t.dataset.dr&&ui.draft){const p=t.dataset.dr;let v=t.type==='checkbox'?t.checked:t.value;setPath(ui.draft,p,v)}});
document.addEventListener('change',e=>safeAction(()=>{const t=e.target,k=t.dataset.change;if(!k)return;
  if(k==='hoursscope'){ui.hoursScope=t.value||null;render();return}
  if(k==='repdate'){ui.repDate=t.value||TODAY();render();return}
  if(k==='regphoto'&&t.files[0])downscale(t.files[0],360,u=>{ui.regPhoto=u;$('#rg-prev').innerHTML=`<img src="${u}" alt="Photo preview">`});
  if(k==='editphoto'&&t.files[0])downscale(t.files[0],360,u=>{ui.editPhoto=u;$('#me-photostatus').textContent='Replacement photo ready'});
  if(k==='svcphoto'&&t.files[0])downscale(t.files[0],900,u=>{ui.draft.photo=u;render()});
  if(k==='regplan'){if(API_MODE){resetPaymentPreview(t.closest('form'));return}$('#rg-sum').textContent=regSum(S.plans.find(p=>p.id===t.value))}
  if(k==='rnplan'){ui.modal.plan=t.value;if(API_MODE){resetPaymentPreview(t.closest('form'));return}const m=S.members.find(x=>x.id===ui.modal.id),p=S.plans.find(x=>x.id===t.value);$('#rn-calc').innerHTML=rnCalc(m,p);const b=$('[data-form=renew] .btn.primary');if(b)b.textContent=p?'Confirm payment of '+E(p.price):'No plan available'}},e.target.closest?.('form')));
document.addEventListener('submit',e=>safeAction(()=>{e.preventDefault();const f=e.target,k=f.dataset.form;if(!k)return;const v=id=>(f.querySelector('#'+id)||{}).value;const T=TODAY();
  if(API_MODE)return serverSubmit(f);
  if(k==='login')return doLogin(f);
  if(k==='changepw')return changeOwnPassword(f);
  requireRole(['register','renew','memberedit'].includes(k)?['staff','manager']:['manager']);
  if(k==='memberedit')return saveMemberEdit(f);
  if(k==='register'){const first=v('rg-f').trim(),sur=v('rg-s').trim(),t=v('rg-t'),n=v('rg-n').trim(),pw=v('rg-p'),pl=S.plans.find(p=>p.id===v('rg-l')),rc=v('rg-r').trim();
    if(!['Student ID','National ID','Passport','Birth certificate'].includes(t))return setMsg(f,'Choose a valid identity document.');
    if(!first||!sur||!n)return setMsg(f,'Enter the first name, surname and ID number from the document.');
    const dup=S.members.find(m=>m.idType===t&&m.idNum.toLowerCase()===n.toLowerCase());if(dup)return setMsg(f,`This ${t} is already registered to ${fullName(dup)}. Open them from Members instead.`);
    if(!validPhoto(ui.regPhoto))return setMsg(f,'A valid photo is required before the member can be saved.');
    availablePlan(v('rg-l'));
    if(pw.length<8)return setMsg(f,'The password needs at least 8 characters.');
    if(!rc)return setMsg(f,'Enter the receipt number for the cash payment.');if(S.payments.some(p=>p.receipt.toLowerCase()===rc.toLowerCase()))return setMsg(f,'That receipt number has already been used.');
    const m={id:uid('m'),first,sur,idType:t,idNum:n,pw,photo:ui.regPhoto,reg:T,active:true,fails:0,lock:0};S.members.push(m);
    S.payments.push(paymentFor(m,pl,rc));save();ui.regPhoto=null;ui.regDone=m;toast('Member saved');render();return}
  if(k==='renew'){const mo=ui.modal,m=S.members.find(x=>x.id===mo.id),p=availablePlan(mo.plan),rc=v('rn-r').trim();
    if(!rc)return setMsg(f,'Enter the receipt number for the cash payment.');if(S.payments.some(x=>x.receipt.toLowerCase()===rc.toLowerCase()))return setMsg(f,'That receipt number has already been used.');
    const c=calcExpiry(memExpiry(m.id),T,p.days);S.payments.push(paymentFor(m,p,rc));save();
    ui.modal=null;ui.ciMsg={type:'good',text:`${fullName(m)} renewed. New expiry ${fmtL(c.exp)}.`};toast('Payment recorded');render();return}
  if(k==='svc'){const d=ui.draft;if(!d.name.trim())return setMsg(f,'Give the service a name.');if(!d.slots.length)return setMsg(f,'Add at least one time slot.');
    if(d.slots.some(s=>!s.days.length||!s.start||!s.end||s.end<=s.start))return setMsg(f,'Each time slot needs at least one day and an end time after the start time.');
    d.instructors=d.instructors.filter(i=>i.name.trim());const i=S.services.findIndex(s=>s.id===d.id);i>=0?S.services[i]=d:S.services.push(d);save();ui.draft=null;toast('Service saved. The public page is updated.');render();return}
  if(k==='hours'){const scope=f.dataset.scope||null,week=[];
    if(scope&&!S.services.some(s=>s.id===scope))return setMsg(f,'Choose a valid area.');
    for(let i=0;i<7;i++){const closed=f.querySelector('#hr-x'+i).checked,open=v('hr-o'+i),close=v('hr-c'+i);if(!closed&&(!open||!close||close<=open))return setMsg(f,`${DAYF[i]}: closing must be after opening.`);week.push({closed,open:closed?'':open,close:closed?'':close})}
    const before=scope?S.areaHours[scope]||null:S.hours;audit('operating_times',scope||'gym','UPDATE',before,week);if(scope)S.areaHours[scope]=week;else S.hours=week;save();setMsg(f,'Opening hours saved.','good');toast('Hours saved');return}
  if(k==='override'){const date=v('ov-d'),closed=f.querySelector('#ov-closed').checked,svc=v('ov-scope')||null,open=v('ov-o'),close=v('ov-c');
    if(!date)return setMsg(f,'Choose a date.');if(svc&&!S.services.some(s=>s.id===svc))return setMsg(f,'Choose a valid area.');if(!closed&&(!open||!close||close<=open))return setMsg(f,'Closing time must be after opening time.');
    const o=S.overrides.find(o=>!o.cancelled&&o.date===date&&(o.svc||null)===svc),before=o?{...o}:null;
    const next={id:o?.id||uid('o'),date,svc,closed,open:closed?'':open,close:closed?'':close,reason:v('ov-r').trim(),by:o?.by||ui.session.id,at:o?.at||nowStr(),updatedBy:ui.session.id,updatedAt:nowStr()};
    if(o)Object.assign(o,next);else S.overrides.push(next);audit('time_overrides',next.id,before?'UPDATE':'INSERT',before,next);save();toast('Date change saved');render();return}
  if(k==='notice'){const msg=v('nt-m').trim(),start=v('nt-a'),end=v('nt-b'),svc=v('nt-s')||null;if(!msg)return setMsg(f,'Write the message members should see.');if(!start||!end||end<start)return setMsg(f,'The end date must be on or after the start date.');if(svc&&!S.services.some(s=>s.id===svc))return setMsg(f,'Choose a valid area.');
    const n=S.notices.find(x=>x.id===ui.noticeEdit),before=n?{...n}:null;
    if(ui.noticeEdit&&!n)return setMsg(f,'The notice no longer exists.');
    const next={id:n?.id||uid('n'),msg,svc,start,end,by:n?.by||ui.session.id,at:n?.at||nowStr(),updatedBy:ui.session.id,updatedAt:nowStr()};if(n)Object.assign(n,next);else S.notices.push(next);audit('notices',next.id,before?'UPDATE':'INSERT',before,next);ui.noticeEdit=null;save();toast('Notice saved. Current and upcoming notices are public.');render();return}
  if(k==='contact'){S.contact={address:v('ct-a').trim(),phone:v('ct-p').trim(),email:v('ct-e').trim()};save();setMsg(f,'Contact details saved.','good');return}
  if(k==='plans'){const np=S.plans.map((p,i)=>({...p,name:v('pl-n'+i).trim(),price:v('pl-p'+i).trim()===''?NaN:Number(v('pl-p'+i)),days:v('pl-d'+i).trim()===''?NaN:Number(v('pl-d'+i)),on:f.querySelector('#pl-o'+i).checked}));
    if(np.some(p=>!p.name))return setMsg(f,'Every plan needs a name.');if(np.some(p=>!Number.isFinite(p.price)||p.price<0||Math.abs(p.price*100-Math.round(p.price*100))>1e-6||!Number.isInteger(p.days)||p.days<1||p.days>3650))return setMsg(f,'Use a nonnegative price with at most two decimal places and a whole duration from 1 to 3650 days.');if(new Set(np.map(p=>p.name.toLowerCase())).size!==np.length)return setMsg(f,'Plan names must be unique.');audit('plans','catalogue','UPDATE',S.plans,np);S.plans=np;save();setMsg(f,'Plans saved.','good');toast('Plans saved');return}
  if(k==='mempw'){const pw=v('mp-pw');if(pw.length<8)return setMsg(f,'The password needs at least 8 characters.');const m=S.members.find(x=>x.id===f.dataset.id);m.pw=pw;m.fails=0;m.lock=0;m.mustChangePassword=true;save();f.querySelector('#mp-pw').value='';setMsg(f,'Password changed for '+fullName(m)+'.','good');return}
  if(k==='staffmsg'){const msg=v('sm-m').trim(),to=v('sm-to');if(!msg)return setMsg(f,'Write the message first.');S.staffMsgs.push({id:uid('sm'),msg,to,by:ui.session.id,at:nowStr(),read:[]});save();toast(to==='all'?'Sent to all staff':'Sent to '+staffName(to));render();return}
  if(k==='newstaff'){const n=v('ns-n').trim(),u=v('ns-u').trim().toLowerCase(),p=v('ns-p');if(!n||!u)return setMsg(f,'Enter a name and a username.');if(S.staff.some(x=>x.u===u))return setMsg(f,'That username is already taken.');if(p.length<8)return setMsg(f,'The password needs at least 8 characters.');
    S.staff.push({u,name:n,role:'staff',pw:p,on:true});save();toast('Account created');render();return}
},e.target));

for(const event of ['click','keydown','input'])document.addEventListener(event,()=>{lastActivity=Date.now()});
